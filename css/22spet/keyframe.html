<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>key frame animation</title>
    <style>
.loader{
    width: 50px;
    height: 50px;
    background-color: red;
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%{transform: scale(1); border-radius: 0px;}
    50%{transform: scale(1.5); border-radius: 275px;}
    100%{transform: scale(2); border-radius: 0px;}
    
}
    </style>
</head>
<body>
    <div class="loader" >

    </div>
</body>
</html>
