<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
    <link rel="stylesheet" href="./imagegallery.css">

</head>
<body>
   <h1>responsive flexbox and photo gallery </h1>
   <div class="gallery">
    <img src="https://picsum.photos/200/300" alt="Random image">
<img src="https://picsum.photos/300/200" alt="Random image">
<img src="https://picsum.photos/250/250" alt="Random image">
<img src="https://picsum.photos/400/200?grayscale" alt="Grayscale image">
<img src="https://picsum.photos/id/237/200/300" alt="Specific image by id">
<img src="https://picsum.photos/500/300?blur=2" alt="Blurred image">
<img src="https://picsum.photos/600/400" alt="Random wide image">
<img src="https://picsum.photos/450?grayscale&blur=3" alt="Grayscale + blur">
<img src="https://picsum.photos/320/240" alt="Random 320x240">



   </div>

   <h2>overflow scrollable gallery</h2>
   <!-- horizontal scrollable gallery -->
   <div class="scrollablegallery">
    <img src="https://picsum.photos/350/200" alt="Random image 350x200">
<img src="https://picsum.photos/450/250?grayscale" alt="Grayscale image 450x250">
<img src="https://picsum.photos/300/300?blur=3" alt="Blurred square 300x300">
<img src="https://picsum.photos/id/1011/400/300" alt="Specific id image 400x300">
<img src="https://placehold.co/600x400/ff0000/000000/png?text=Hello+World" alt="Colored placeholder">
<img src="https://placehold.co/800x600" alt="Simple placeholder 800x600">
<img src="https://fpoimg.com/500x300?bg_color=cccccc&text_color=333333&text=Sample" alt="FPO sample">
<img src="https://fpoimg.com/400x400?bg_color=eeeeee&text_color=000000" alt="Square placeholder">
<img src="https://loremflickr.com/320/240/dog" alt="Dog image 320x240">
<img src="https://loremflickr.com/640/480/forest" alt="Forest image">
<img src="https://placehold.jp/200x200.png?text=200x200" alt="Placehold.jp 200x200">
<img src="https://placehold.jp/50x50.png?&background=ffcc00&text=Icon" alt="Small icon placeholder">
<img src="https://picsum.photos/720/480" alt="Wide landscape">
<img src="https://picsum.photos/480/720" alt="Portrait">
<img src="https://picsum.photos/800/800" alt="Square large">
<img src="https://placehold.co/1024x768/abcdef/123456/png?text=Title" alt="Large colored placeholder">
<img src="https://placehold.co/300x150/00ff00/ffffff/png?text=Banner" alt="Banner size">
<img src="https://picsum.photos/1200/500?random=10" alt="Random wide large">
<img src="https://picsum.photos/500/1200?random=20" alt="Random tall large">
<img src="https://loremflickr.com/500/300/beach" alt="Beach image 500x300">


   </div>
</body>
</html>
