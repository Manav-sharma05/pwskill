<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            padding: 12px;
            background-color: aqua;
            color: rgb(22, 16, 16);
            font-size: 18px;
            border: none;
            border-radius:5px;
            cursor: grab;
            

            transition: all 1s ease-in-out 1s;

           /* transition: background 0.5s ease-in 1s,transform 1s ease-in-out 1s ; */
        }
        button:hover{
            background-color: rgb(247, 12, 32);
            transform:rotate(1.2);

        }

    </style>
</head>
<body>
    <button>hover me!</button>
    
</body>
</html>
