<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto 200px 100px;
            background-color: rgb(9, 41, 65);
            column-gap: 29px;
            row-gap: 10px;
            padding: 10px;
            border-radius: 20px;
            
        }

        .container>div {
            background-color: rgb(165, 26, 26);
            border: 1px solid black;
            padding: 20px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 4px 4px 20px;
        }

        .item1 {
            /* grid-column-start: 1;
        grid-column-end: 4; */
            /* grid-column: 1/span 4; */


            /* 
        grid-row-start:1;
        grid-row-end: 3; */

            grid-row: 1/3;
            grid-column: 1/3;


        }
        .container2{
            display: grid;
            grid-template-columns: auto auto auto;
            background-color: pink;
            gap: 10px;
            color: white;
            padding: 10px;
        }
        .container2  div{
            background-color: black;
            padding-left: 120px;
            text-align: center;
            padding: 10px;
        }
        .one{
           grid-column: 1/3;
        }.two{
            grid-column: 3;
            grid-row: 1/3;
        }
        .five{
            grid-column: 1/4;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="item1">child1</div>
        <div>child2</div>
        <div class="item2">child3</div>
        <div>child4</div>
        <div>child5</div>
        <div>child9</div>
        <div>child6</div>
        <div>child7</div>
        <div>child8</div>
        <div>child6</div>
        <div>chikd7</div>
        <div>child8</div>
    </div>
    <div class=container2>
        <div class="one">one</div>
        <div class="two">two</div>
        <div class="three">three</div>
        <div class="four">four</div>
        <div class="five">five</div>
    </div>
</body>

</html>
